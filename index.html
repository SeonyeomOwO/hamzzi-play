<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>햄찌 콤바인 프로토타입</title>
<style>
  html,body{margin:0;height:100%;background:#1a140f;color:#fff6e8;font-family:system-ui,"Malgun Gothic",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:960px;height:540px;flex:none;transform-origin:center}
  canvas{display:block;width:960px;height:540px;background:#000;cursor:crosshair;touch-action:none}
  #ui{position:absolute;inset:0;pointer-events:none}
  button{pointer-events:auto;font:inherit;font-size:14px;background:#5a3a24;color:#fff6e8;border:2px solid #fff1dc;padding:6px 12px;cursor:pointer;border-radius:6px}
  button:hover:not(:disabled){background:#7a5034}
  button.on{background:#fff1dc;color:#4a2c1d}
  button:disabled{opacity:.35;cursor:default}
  button.go{background:#3f8ee0;border-color:#d6ecff}
  /* top-left corner: sunflower seeds owned */
  #corner{position:absolute;left:10px;top:8px;width:116px;display:flex;flex-direction:column;gap:4px}
  #seedCount{border:2px solid #fff1dc;background:#2a1d14e6;border-radius:6px;padding:3px 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:17px;font-weight:700;color:#ffd84a}
  .seedIco{width:12px;height:8px;border-radius:50%;background:#e8e2d0;border:1.5px solid #4a2c1d;transform:rotate(-30deg);flex:none}
  /* left menu, one button per row */
  #tabs{position:absolute;left:10px;top:56px;width:116px;display:flex;flex-direction:column;gap:6px}
  #tabs button{width:100%;text-align:left;padding:8px 10px;transition:transform .35s cubic-bezier(.34,1.9,.5,1),background .15s;transform-origin:left center}
  #tabs button.on{transform:translateX(8px) scale(1.04)}
  #tabs button:hover:not(.on){transform:translateX(3px)}
  body.tut #tabs button:not(.tutGlow), body.tut #startBtn:not(.tutGlow){opacity:.35;pointer-events:none;filter:saturate(.4)}
  .tutGlow{animation:tutGlow .9s ease-in-out infinite !important;box-shadow:0 0 0 3px #ffd23f,0 0 18px 4px #ffd23faa !important}
  @keyframes tutGlow{0%,100%{transform:translateX(8px) scale(1.04)}50%{transform:translateX(8px) scale(1.12,.94)}}
  #tabs button.boing{animation:boing .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes boing{0%{transform:translateX(8px) scale(1.04)}15%{transform:translateX(8px) scale(1.22,.78)}40%{transform:translateX(8px) scale(.9,1.12)}65%{transform:translateX(8px) scale(1.07,.95)}100%{transform:translateX(8px) scale(1.04)}}
  button:active:not(:disabled){transform:scale(1.12,.86)}
  button{transition:transform .25s cubic-bezier(.34,1.9,.5,1)}
  #startBtn{animation:breathe 1.6s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.05,.97)}}
  #launch{position:absolute;right:16px;bottom:12px;display:flex;flex-direction:column;gap:6px;align-items:stretch}   /* bottom-right: 수확 출발 */
  #startBtn{width:200px;padding:8px 12px;font-size:15px}
  /* the 기록 tab's test buttons under the board */
  #actions{position:absolute;left:430px;bottom:8px;transform:translateX(-50%);display:flex;gap:8px}
  #endRun{position:absolute;right:12px;bottom:12px}
  #skipBtn{position:absolute;right:12px;top:12px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="tabs">
      <button data-tab="plinko">씨앗 정산</button>
      <button data-tab="tree">스킬 트리</button>
      <button data-tab="box">해바라기 화분</button>
      <button data-tab="relic">유물</button>
      <button data-tab="settings">환경 설정</button>
      <button data-tab="stats">기록</button>
    </div>
    <div id="corner">
      <div id="seedCount" title="가지고 있는 해바라기씨"><span class="seedIco"></span><span id="seedNum">0</span></div>
    </div>
    <div id="launch">
      <button id="startBtn" class="go">수확 출발</button>
    </div>
    <div id="actions">
      <button id="cheatBtn">테스트: 해바라기씨 x10</button>
      <button id="testBtn">테스트: 부품 전부 + 씨앗 500</button>
      <button id="dropTestBtn">테스트: 물방울 x10</button>
    </div>
    <button id="endRun">집으로 돌아가기</button>
    <button id="skipBtn">건너뛰기</button>
  </div>
</div></div>
<script>
'use strict';
const W = 960, H = 540;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
// --- safety net for every device ---
// A negative arc/ellipse radius makes the canvas throw (IndexSizeError), and one throw used to stop the whole game loop.
// Pop-in animations pass through tiny radii (e.g. r - 2 while r is 1..2), so clamp them to 0 here once for the whole game.
(() => {
  const P = CanvasRenderingContext2D.prototype, arc = P.arc, ellipse = P.ellipse;
  const ok = v => (v > 0 ? v : 0);   // (also turns NaN into 0)
  P.arc = function (x, y, r, a0, a1, ccw) { return arc.call(this, x, y, ok(r), a0, a1, ccw); };
  P.ellipse = function (x, y, rx, ry, rot, a0, a1, ccw) { return ellipse.call(this, x, y, ok(rx), ok(ry), rot, a0, a1, ccw); };
  // older phone browsers (Safari < 16, old Android WebView / in-app browsers) have no roundRect
  if (!P.roundRect) P.roundRect = function (x, y, w, h, r = 0) {
    r = Math.max(0, Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, Math.abs(w) / 2, Math.abs(h) / 2));
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
  if (!Array.prototype.findLastIndex) Array.prototype.findLastIndex = function (f) { for (let i = this.length - 1; i >= 0; i--) if (f(this[i], i, this)) return i; return -1; };
})();
let K = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  $('stage').style.transform = `scale(${s})`;
  K = s * (devicePixelRatio || 1);
  cv.width = Math.round(W * K); cv.height = Math.round(H * K);
}
addEventListener('resize', resize); resize();

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function fmt(n) {
  if (n < 1000) return (n < 10 && n % 1) ? n.toFixed(1) : String(Math.floor(n));
  if (n < 1e6) return Math.floor(n).toLocaleString('en-US');
  const u = ['K', 'M', 'B', 'T', 'Qa', 'Qi']; let i = -1;
  while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
  return n.toFixed(2) + u[i];
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickW(ws) { let r = Math.random() * ws.reduce((a, b) => a + b, 0); for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0 && ws[i] > 0) return i; } return ws.findIndex(w => w > 0); }

// IP palette (Proj_K 햄찌): round orange-cream body, pink ears, blue overalls, yellow hard hat, dark brown outline
const PAL = { fur: '#f6c27a', belly: '#fff1dc', ear: '#f5a5a5', line: '#4a2c1d', overall: '#3f8ee0', hat: '#ffd23f', combine: '#d9483b', header: '#e8c24a' };
const CUR = '해바라기씨';   // currency name

// =====================================================================
// DESIGN DATA — every number the design doc lists lives in these tables.
// =====================================================================
const SEEDS = [
  { name: '해바라기씨', color: '#8a8f99', value: 1 },
  { name: '줄무늬 씨', color: '#c9cdd4', value: 3 },
  { name: '볶은 씨', color: '#b8743a', value: 6 },
  { name: '꿀 바른 씨', color: '#f2a93b', value: 12 },
  { name: '황금 씨', color: '#ffd23f', value: 25 },
  { name: '무지개 씨', color: '#e66bd0', value: 45 },
  { name: '별빛 씨', color: '#7fe8ff', value: 80 },
];
// 20 fields. Each run starts at a chosen field and warps one field deeper every time today's goal is met (up to FIELD.zones zones).
// hp = sunflower HP multiplier, quota = seeds to collect in one zone, rocks/thorns/crow = hazards (crow = seconds between crows).
const FIELD_NAMES = ['뒷마당', '텃밭', '들판', '과수원', '밀밭', '옥수수밭', '해바라기 언덕', '노을 들판', '달빛 농장', '안개 계곡',
  '바람의 언덕', '꽃구름 평원', '무지개 들판', '별빛 목장', '황금 밀밭', '눈꽃 고원', '화산 밭', '구름 위 정원', '은하 농장', '전설의 평원'];
const FIELD_BGS = ['#4f7a3a', '#5d6b2e', '#5f8a35', '#3f6b3f', '#8c7130', '#6f7d2a', '#9a7b26', '#8c4428', '#2a3a5a', '#4a5a5a',
  '#5a7a4a', '#6a5a7a', '#4a6a7a', '#2a2a5a', '#9a8a2a', '#6a8a9a', '#7a3a2a', '#5a7a9a', '#2a1a4a', '#5a3a6a'];
// HP grows x1.6 per field up to field 11, then x1.7 (late game income snowballs, so the late fields get tougher faster).
// quota is per chapter; a field needs all 5 chapters in one harvest. Tuned with balance-sim.js: ~3.5 min per field, field 20 at ~65-75 min.
const FIELD = { hpBase: 1, hpGrowth: 1.6, hpGrowth2: 1.7, hpKnee: 10, quotaBase: 8, quotaGrowth: 1.22, zones: 5 };
const fieldHp = i => FIELD.hpBase * Math.pow(FIELD.hpGrowth, Math.min(i, FIELD.hpKnee)) * Math.pow(FIELD.hpGrowth2, Math.max(0, i - FIELD.hpKnee));
function seedWeights(i) {   // higher fields shift toward rarer seeds
  const maxTier = Math.min(SEEDS.length - 1, Math.floor((i + 1) / 3)), c = i * 0.3;
  return SEEDS.map((_, k) => k <= maxTier ? Math.exp(-((k - c) ** 2) / 2.4) : 0);
}
const SECTORS = FIELD_NAMES.map((name, i) => ({
  name, bg: FIELD_BGS[i], hp: Math.round(fieldHp(i)), quota: Math.round(FIELD.quotaBase * Math.pow(FIELD.quotaGrowth, i)),
  seeds: seedWeights(i), armor: i >= 4 ? Math.min(.3, .1 + .01 * (i - 4)) : 0, explode: i >= 6 ? Math.min(.16, .06 + .006 * (i - 6)) : 0,
  // Hazards come in two kinds:
  //  FIXED — rocks, mud, thorns: laid out with the chapter and stay put (kept few, so the field stays readable)
  rocks: Math.min(2, 1 + Math.floor(i / 8)), mud: Math.min(2, 1 + Math.floor(i / 10)),
  thorns: i >= 1 ? Math.min(2, 1 + Math.floor((i - 1) / 10)) : 0,
  //  TEMPORARY — crows, hedgehogs, mushrooms, boars: one shows up every `evtEvery` s, bothers you for a while, then leaves.
  //  At most `evtMax` are around at once. Which ones can appear widens with the field (see HAZARD.events).
  evtEvery: Math.max(3, 8 - 0.25 * i), evtMax: Math.min(3, 1 + Math.floor(i / 7)),
}));
const ENDLESS = { bgs: ['#3d5a2e', '#6b4a2a', '#2e4a5a', '#5a2e4a'] };
function sec(i) {
  if (i < SECTORS.length) return SECTORS[i];
  const last = SECTORS[SECTORS.length - 1], n = i - SECTORS.length + 1;
  return { ...last, name: `끝없는 들판 ${n}`, bg: ENDLESS.bgs[n % ENDLESS.bgs.length], hp: Math.round(last.hp * Math.pow(FIELD.hpGrowth2, n)),
    quota: Math.round(last.quota * Math.pow(FIELD.quotaGrowth, n)) };
}
// Chapter weather, rolled for every chapter: rarer weather = rarer seeds and more seeds per sunflower,
// and every weather changes the field its own way (fx, see the WEATHER section):
//   grow  sunflowers sprout this much faster      wind  gusts push the combine and blow seeds about
//   rain  puddles fill up (slow) and wet seeds last seedLife x longer
//   snow  snow piles up: the combine and the seeds slide more and more   golden  + golden sunflower chance   mag  x collect range
const ZONES = [
  { name: '맑음', icon: 'sun', color: '#ffe08a', w: 45, tier: 0, extra: 0, fx: { grow: 1.6 }, desc: '햇볕 쨍쨍! 해바라기가 쑥쑥 자라요' },
  { name: '산들바람', icon: 'breeze', color: '#9ee6c8', w: 22, tier: 1, extra: 1, fx: { wind: 85 }, desc: '바람이 씨앗을 날려요 · 바람을 타면 빨라요' },
  { name: '단비', icon: 'rain', color: '#7fc4ff', w: 12, tier: 2, extra: 2, fx: { rain: 5, seedLife: 1.6 }, desc: '웅덩이는 느려요 · 젖은 씨앗은 오래 남아요' },
  { name: '함박눈', icon: 'snow', color: '#dff0ff', w: 11, tier: 2, extra: 2, fx: { snow: 1 }, desc: '눈이 쌓일수록 미끌미끌! 씨앗도 미끄러져요' },
  { name: '무지개', icon: 'rainbow', color: '#e68bff', w: 7, tier: 3, extra: 3, fx: { golden: 0.05 }, desc: '황금 해바라기가 자주 피어요' },
  { name: '황금 햇살', icon: 'gold', color: '#ffd23f', w: 3, tier: 4, extra: 5, fx: { mag: 1.6, golden: 0.03 }, desc: '반짝반짝! 씨앗이 멀리서도 끌려와요' },
];
// Hazards: touching a rock or a crow costs one point of combine durability; thorn patches slow you and scratch over time.
const HAZARD = { rockR: [16, 24], thornR: [36, 52], thornSlow: 0.45, thornTick: 1.5, crowSpeed: [130, 190], invuln: 1.2, knock: 260, fuelHit: 4,
  mudR: [40, 58], mudSlow: 0.55,                         // mud: only slows you down
  hedgeR: 15, hedgeSpeed: 45,                            // hedgehog: wanders around, prickly to touch
  shroomR: 16, shroomBlast: 64, shroomCd: [3.5, 5.5], shroomWarn: 0.9,   // mushroom: swells (warning ring), then puffs spores
  boarSpeed: 540, boarWarn: 1.1,
  hedgeLife: [6, 9], shroomPuffs: 2,                     // a hedgehog wanders this long then burrows; a mushroom puffs this many times then withers
  // temporary hazard pool: kind -> first field (0-based) it can appear in
  events: { crow: 1, hedge: 2, shroom: 4, boar: 7 } };                       // boar: a red lane flashes, then it charges straight across

// Skill tree. fx = effect per level (summed in stats()). excl = mutually exclusive partner.
const SKILLS = [
  // --- 장비 (오른쪽) ---
  { id: 'core', group: '장비', name: '헤더 칼날', desc: '밟기 수확 대미지 +1', x: 0, y: 0, max: 10, cost: 8, g: 1.6, req: [], fx: { dmg: 1 } },
  { id: 'fire', group: '장비', name: '칼날 회전 속도', desc: '밟기 수확 속도 +8%', x: 1, y: 0, max: 10, cost: 15, g: 1.65, req: ['core'], fx: { fireP: .08 } },
  { id: 'critC', group: '장비', name: '깔끔한 수확', desc: '치명타 확률 +5%p', x: 1, y: -1, max: 8, cost: 60, g: 1.75, req: ['fire'], fx: { critC: .05 } },
  { id: 'critD', group: '장비', name: '한 번에 쑥', desc: '치명타 대미지 +30%p', x: 1, y: -2, max: 5, cost: 300, g: 2, req: ['critC'], fx: { critD: .3 } },
  { id: 'focus', group: '장비', name: '날 세우기', desc: '모든 대미지 +12% (넓은 헤더와 택1)', x: 2, y: -1, max: 5, cost: 400, g: 2, req: ['critC'], fx: { dmgP: .12 }, excl: 'scatter' },
  { id: 'bspd', group: '장비', name: '헤더 확장', desc: '헤더 폭 +10% (한 번에 더 넓게 밟음)', x: 2, y: 0, max: 5, cost: 60, g: 1.8, req: ['fire'], fx: { reach: .1 } },
  { id: 'pierce', group: '장비', name: '수확 충격파', desc: '밟아서 수확하면 주변 해바라기에 수확 대미지의 20% (레벨당)', x: 3, y: 0, max: 3, cost: 600, g: 3, req: ['bspd'], fx: { shock: .2 } },
  { id: 'armorPen', group: '장비', name: '강철 칼날', desc: '억센 해바라기에 밟기·조수 대미지 +15%p', x: 3, y: -1, max: 5, cost: 6000, g: 2.1, req: ['pierce'], fx: { armorPen: .15 } },
  { id: 'mis', group: '장비', name: '꿀벌 친구', desc: '해바라기를 찾아가는 꿀벌 +1 (2.2초마다 출동)', x: 1, y: 1, max: 3, cost: 300, g: 2.5, req: ['fire'], fx: { mis: 1 } },
  { id: 'scatter', group: '장비', name: '넓은 헤더', desc: '헤더 폭 +35% (날 세우기와 택1)', x: 2, y: 1, max: 2, cost: 400, g: 4, req: ['mis'], fx: { reach: .35 }, excl: 'focus' },
  { id: 'misCd', group: '장비', name: '꿀 보급', desc: '꿀벌 출동 속도 +10%', x: 1, y: 2, max: 5, cost: 500, g: 2, req: ['mis'], fx: { misCd: .1 } },
  { id: 'heavy', group: '장비', name: '왕벌', desc: '꿀벌 대미지 +40%, 침 범위 +15% (벌떼와 택1)', x: 2, y: 2, max: 5, cost: 4800, g: 2.1, req: ['misCd'], fx: { misD: .4, misR: .15 }, excl: 'swarm' },
  { id: 'swarm', group: '장비', name: '벌떼', desc: '꿀벌 +1, 출동 속도 +10% (왕벌과 택1)', x: 1, y: 3, max: 3, cost: 4800, g: 2.6, req: ['misCd'], fx: { mis: 1, misCd: .1 }, excl: 'heavy' },
  { id: 'las', group: '장비', name: '회전 탈곡기', desc: '3.5초마다 콤바인 주위를 한 바퀴 쓸어 수확 (레벨당 대미지 증가)', x: 4, y: 0, max: 5, cost: 10000, g: 2.3, req: ['pierce'], fx: { las: 1 } },
  { id: 'lasCd', group: '장비', name: '윤활유', desc: '회전 탈곡기 작동 속도 +12%', x: 5, y: 0, max: 5, cost: 16000, g: 2.1, req: ['las'], fx: { lasCd: .12 } },
  { id: 'deep', group: '장비', name: '무거운 날', desc: '회전 탈곡기 대미지 +50% (긴 날과 택1)', x: 5, y: -1, max: 5, cost: 32000, g: 2.1, req: ['lasCd'], fx: { lasD: .5 }, excl: 'prism' },
  { id: 'prism', group: '장비', name: '긴 날', desc: '회전 탈곡기 범위 +30% (무거운 날과 택1)', x: 5, y: 1, max: 2, cost: 32000, g: 4, req: ['lasCd'], fx: { lasR: .3 }, excl: 'deep' },
  { id: 'drone', group: '장비', name: '꼬마 햄찌 조수', desc: '낫을 들고 콤바인 주위를 돌며 닿는 해바라기를 베는 조수 +1', x: 4, y: 1, max: 3, cost: 20000, g: 3, req: ['las'], fx: { drone: 1 } },
  { id: 'droneD', group: '장비', name: '조수 간식', desc: '조수 대미지 +25%', x: 4, y: 2, max: 5, cost: 24000, g: 2, req: ['drone'], fx: { droneD: .25 } },
  { id: 'roller', group: '장비', name: '탈곡 롤러', desc: '콤바인 뒤에 롤러를 달아 지나간 자리를 한 번 더 수확 (레벨당 대미지 증가)', x: 3, y: 1, max: 5, cost: 900, g: 2.2, req: ['bspd'], fx: { roller: 1 } },

// PINBALL — 씨앗 정산 (햄찌 핀볼)
// =====================================================================
// A fixed pinball table. The seed silo IS the launch tube on the right edge: harvested seeds pour in from the top and
// pile up on the spring. Hold the spring (click-hold the tube, or Space), let go — the whole column shoots up the tube,
// round the top-right curve and sprays into the table: bumpers, mushroom slings, spinners, the top lanes, acorn
// targets, the mole rail, the hamster wheel, two rows of pegs and the bounce bar, then down into a jar.
const PB = { x0: 150, x1: 944, top: 58, binY: 416 };

const mx = x => 2 * XC - x;

// part = the pinball part a wall belongs to: it only exists while you own that part
const wall = (ax, ay, bx, by, t = 3, edge = false, part = null) => WALLS.push([ax, ay, bx, by, t, edge, part]);

    ctx.beginPath(); ctx.ellipse(640, 235, 190, 100, 0, 0, 6.28); ctx.fill(); ctx.stroke();

    if (t > 2.5) { ctx.globalAlpha = Math.min(1, t - 2.5); txt('햄찌 콤바인', W / 2, 470, 40, '#ffd23f', 'center', true); ctx.globalAlpha = 1; }
  }
  // caption lines
  const L = PROLOGUE[k];
  ctx.fillStyle = '#000000aa'; ctx.fillRect(0, 40, W, 70);
  L.forEach((s, i) => { ctx.globalAlpha = clamp((t - i * 1.6) * 2, 0, 1); txt(s, W / 2, 62 + i * 28, 20, '#fff', 'center', i === 1); });
  ctx.globalAlpha = 1;
  txt(`${k + 1} / ${PROLOGUE.length} · 클릭하면 다음`, W / 2, H - 18, 12, '#ffffffaa', 'center');
}
function drawCombineSide(x, y, t, withHam) {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = PAL.line; ctx.lineWidth = 4;
  ctx.fillStyle = PAL.combine; ctx.beginPath(); ctx.roundRect(-110, -70, 180, 90, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#9ad1ff'; ctx.beginPath(); ctx.roundRect(-20, -120, 80, 56, 8); ctx.fill(); ctx.stroke();
  ctx.fillStyle = PAL.header; ctx.beginPath(); ctx.roundRect(70, -10, 70, 40, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#7a5a10'; for (let i = 0; i < 4; i++) ctx.fillRect(80 + i * 15, -4 + Math.sin(t * 12 + i) * 3, 6, 28);
  ctx.fillStyle = '#2b2b2b'; for (const wx of [-70, 30]) { ctx.beginPath(); ctx.arc(wx, 28, 26, 0, 6.28); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#888'; ctx.beginPath(); ctx.arc(wx, 28, 9, 0, 6.28); ctx.fill(); ctx.fillStyle = '#2b2b2b'; }
  ctx.fillStyle = '#8a3a2a'; ctx.fillRect(-100, -96, 14, 30); ctx.strokeRect(-100, -96, 14, 30);
  ctx.restore();
  if (withHam) drawHamster(x + 20, y - 88, 0.75, t > 2.5 ? 'happy' : 'normal', { overall: false });
}

// =====================================================================
// LOOP
// =====================================================================
let last = performance.now();
// The loop never dies: the next frame is booked first, and an error in one frame is logged (console + a small note in
// the corner for testers to screenshot) instead of freezing the game.
const ERR = { msg: '', t: 0, seen: new Set() };
function frame(now) {
  requestAnimationFrame(frame);
  try { frameBody(now); } catch (e) {
    try { for (let i = 0; i < 32; i++) ctx.restore(); ctx.globalAlpha = 1; } catch (_) { }   // unwind any save()/clip the frame left open
    const m = (e && (e.name + ': ' + e.message)) || String(e);
    if (!ERR.seen.has(m)) { ERR.seen.add(m); console.error('[햄찌 콤바인] frame error', e); }
    ERR.msg = m; ERR.t = now;
  }
  if (ERR.msg && now - ERR.t < 8000) {
    ctx.setTransform(K, 0, 0, K, 0, 0); ctx.globalAlpha = 0.85;
    txt('오류 기록: ' + ERR.msg.slice(0, 90), 140, H - 6, 10, '#ff9a8a', 'left'); ctx.globalAlpha = 1;
  }
}
function frameBody(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;   // (never negative: a stale timestamp would run every animation backwards)
  ctx.setTransform(K, 0, 0, K, 0, 0);
  btns = [];
  updatePlinko(dt);
  if (scene === 'run') { updateRun(dt); if (run) drawRun(); }
  if (scene === 'hub') {
    drawField('#3a2a1c', 0.4);
    // screen entrance: the whole page springs in from the right with a squashy overshoot
    tabT += dt;
    const k = ease.outBack(tabT / 0.42, 1.6), [sx, sy] = squash(clamp(1 - tabT / 0.6, 0, 1), 0.06, 2);
    ctx.save(); ctx.globalAlpha = clamp(tabT / 0.15, 0, 1);
    ctx.translate((1 - k) * 90 + 545, 290); ctx.scale(sx * (0.94 + 0.06 * k), sy * (0.94 + 0.06 * k)); ctx.translate(-545, -290);
    if (tab === 'plinko') drawPlinko(); else if (tab === 'tree') drawTree(); else if (tab === 'box') drawBoxes(dt);
    else if (tab === 'relic') drawRelics(); else if (tab === 'settings') drawSettings(); else drawStats();
    ctx.restore(); ctx.globalAlpha = 1;
    updDrawUiFx(dt);
    if (cardShow) { btns = []; drawCardShow(dt); }
  }
  if (scene === 'prologue') drawPrologue(dt);
  if (scene === 'title') { drawTitle(dt); updDrawUiFx(dt); }
  tutTick(dt); tutDom(); drawTut(dt);
  refreshUI();
}
// the game opens on the title screen (the balance sim, ?sim, goes straight to the table)
if (NO_SAVE) updateUI(); else openTitle();
requestAnimationFrame(frame);
</script>
